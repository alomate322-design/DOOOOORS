<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Настройка двери</title>
<style>
  :root{color-scheme:dark;--bg:#14131a;--raised:#1a1922;--line:#2a2833;
    --text:#e4dfd4;--dim:#8b859a;--accent:#c9a96e;--bad:#b06058}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:12.5px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;padding:8px 10px}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .row label{color:var(--dim);white-space:nowrap}
  input[type=text],input[type=number]{background:var(--raised);color:var(--text);
    border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:12.5px}
  input[type=number]{width:62px}
  input[type=text]{flex:1;min-width:0}
  .btn{background:transparent;border:1px solid var(--accent);color:var(--accent);
    border-radius:5px;padding:4px 12px;font-size:12px;cursor:pointer}
  .hint{color:var(--dim);font-size:11px}
  .bad{color:var(--bad)}
</style>
</head>
<body>
  <div class="row">
    <input id="name" type="text" placeholder="Название двери (например, вход в подвал)" />
  </div>
  <div class="row">
    <label><input id="locked" type="checkbox" /> заперта</label>
    <label>взлом <input id="pick" type="number" placeholder="Сл" /></label>
    <label>сила <input id="force" type="number" placeholder="Сл" /></label>
    <button id="save" class="btn">Сохранить</button>
  </div>
  <div id="status" class="hint">Сложности хранятся только у тебя и игрокам не видны.</div>
  <script type="module" src="./menu.js?v=1"></script>
</body>
</html>
